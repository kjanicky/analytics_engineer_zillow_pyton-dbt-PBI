version: 2

models:
  - name: stg_zillow__listings
    description: "Normalized table with the most important fields including prices, dates, attributes of property"
    columns:
      - name: listing_id
        description: "Unique id of property from Zillow"
        tests:
          - unique
          - not_null
      - name: searched_city
        description: "City from API call"
        tests:
          - not_null
      - name: price_usd
        description: "Property price in USD"
        tests:
          - not_null
      - name: listed_at
        description: "Time of creation for listing"
        tests:
          - not_null